<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Shadab Coaching Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <style id="new-layout-css">
/* ═══════════════════════════════════════════════════════════════════
   NEW LAYOUT  (html.bottom-layout) — bottom navbar, profile sheet,
   hero/tile home, icon-only control panel.
   Everything below is scoped to html.bottom-layout, so the classic
   layout (Toggle Layout → Classic) is untouched.
═══════════════════════════════════════════════════════════════════ */
:root{--bn-h:calc(68px + env(safe-area-inset-bottom,0px))}

/* ── Bottom navbar: FIXED to the viewport, so it always floats above the
   browser's own bottom bar instead of falling underneath it ── */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;height:var(--bn-h);box-sizing:border-box;padding:0 10px env(safe-area-inset-bottom,0px);align-items:center;justify-content:space-around;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(14,14,18,.06);z-index:420;-webkit-tap-highlight-color:transparent}
html.bottom-layout.has-bnav .bnav{display:flex}
.bn-item{position:relative;flex:1;height:100%;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--mid);font-family:inherit}
.bn-item svg{width:24px;height:24px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),color var(--t-fast)}
.bn-item::before{content:"";position:absolute;top:0;left:50%;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--ink);transform:translateX(-50%) scaleX(0);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.bn-item.active{color:var(--ink)}
.bn-item.active svg{transform:translateY(-1px) scale(1.08)}
.bn-item.active::before{transform:translateX(-50%) scaleX(1)}
.bnav .bn-badge{position:absolute;top:16px;left:calc(50% + 6px);margin:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:.55rem;border:2px solid var(--white);box-shadow:none;box-sizing:content-box}
#bn-profile svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1),color var(--t-fast)}
#bn-profile.active svg{transform:rotate(60deg) scale(1.08)}

/* ── Top bar: avatar leaves it (profile lives in the bottom bar) ── */
html.bottom-layout #profile-wrap{display:none!important}

/* ── Content never hides behind the bottom bar ── */
html.bottom-layout.has-bnav .lb-full-screen{height:calc(100vh - 58px - var(--bn-h));height:calc(100dvh - 58px - var(--bn-h))}
html.bottom-layout.has-bnav .lb-full-screen.home-scroll{height:auto;min-height:calc(100vh - 58px);min-height:calc(100dvh - 58px);padding-bottom:calc(var(--bn-h) + 16px)}
html.bottom-layout .home-tabs{display:none}

/* ── Chat window sits above the bar; bar tucks away while typing ── */
html.bottom-layout.has-bnav .chat-page{height:calc(var(--vvh,100dvh) - var(--bn-h))}
html.bottom-layout.has-bnav .chat-page.kb-open{height:var(--vvh,100dvh)}
html.bottom-layout.has-bnav .chat-page:not(.kb-open) .cb-composer{padding-bottom:10px}
html.bottom-layout.has-bnav:has(.chat-page.kb-open) .bnav{display:none}

/* ── Profile menu: classic dropdown vs. sheet that opens upward ── */
.pd-svg{display:none}
.pd-item .pd-lbl{flex:0 1 auto}
.pd-item .pd-hint{margin-left:auto;font-size:.66rem;color:var(--mid);font-weight:600;background:var(--faint);border:1px solid var(--line);padding:1px 8px;border-radius:10px}
.p-scrim{position:fixed;inset:0;background:rgba(10,10,14,.38);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s;z-index:415}
html.bottom-layout .p-scrim.show{opacity:1;visibility:visible}
html.bottom-layout .p-dropdown{left:10px;right:10px;top:auto;bottom:calc(var(--bn-h) + 8px);min-width:0;max-width:420px;margin:0 auto;border-radius:var(--r-xl);box-shadow:var(--sh-lg);z-index:430;transform-origin:bottom center;transition:opacity .2s ease,transform .24s cubic-bezier(.32,.9,.4,1),visibility .2s}
html.bottom-layout .p-dropdown.hidden{transform:translateY(18px) scale(.98)}
html.bottom-layout .pd-item{gap:12px;padding:12px 16px}
html.bottom-layout .pd-item .pd-emo{display:none}
html.bottom-layout .pd-item .pd-svg{display:block;width:18px;height:18px;flex-shrink:0;color:var(--mid)}
html.bottom-layout .pd-item.danger .pd-svg{color:var(--bad)}
html.bottom-layout .pd-item .pd-svg.ico-sun{display:none}
html.bottom-layout[data-theme="dark"] .pd-item .pd-svg.ico-moon{display:none}
html.bottom-layout[data-theme="dark"] .pd-item .pd-svg.ico-sun{display:block}

/* ── Home: hero card + 2×1 tiles ── */
.bl-col{display:flex;flex-direction:column;gap:12px}
.bl-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.bl-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:18px 16px 16px}
.bl-hero-ico{font-size:2rem;line-height:1}
.bl-hero h2{margin-top:4px}
.bl-sub{color:var(--mid);font-size:.82rem;margin-bottom:10px}
.bl-hero-btn{width:100%;padding:16px 20px;font-size:.95rem;border-radius:var(--r)}
.bl-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bl-tile{position:relative;flex-direction:column;gap:8px;padding:26px 10px;font-size:.9rem;border-radius:var(--r-lg);line-height:1.2}
.bl-tile-ico{font-size:1.9rem;line-height:1}
.bl-badge{position:absolute;top:8px;right:8px;background:#ef4444;color:#fff;font-size:.6rem;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.bl-selfquiz{width:100%;padding:14px 18px;font-size:.92rem;border-radius:var(--r)}
html.bottom-layout .bl-col .student-notice{max-width:none;width:100%;margin-top:0}
html.bottom-layout .bl-col .notice{margin-top:0}

/* ── Control panel: icon-only row + ONE stage whose height animates ── */
html.bottom-layout .ctrl-panel{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;margin-bottom:14px}
html.bottom-layout .ctrl-panel-head{margin-bottom:10px}
html.bottom-layout .cp-btn-row{gap:8px}
html.bottom-layout .cp-btn{flex-direction:row;height:46px;padding:0;border-radius:var(--r)}
html.bottom-layout .cp-btn:hover{background:var(--faint);border-color:#c0bfb8}
html.bottom-layout .cp-btn.active:hover{background:var(--ink);border-color:var(--ink)}
html.bottom-layout .cp-btn svg{width:21px;height:21px}
html.bottom-layout .cp-btn-label{display:none}
html.bottom-layout .cp-btn-badge{font-size:.55rem;padding:1px 5px;min-width:16px;line-height:1.55}
html.bottom-layout .cp-btn-active{font-size:.5rem;line-height:1.6}
html.bottom-layout .cp-stage{height:0;margin-top:0;overflow:hidden;position:relative;border-radius:var(--r-sm);transition:height .3s cubic-bezier(.4,0,.2,1),margin-top .3s cubic-bezier(.4,0,.2,1)}
html.bottom-layout .cp-stage.open{margin-top:10px}
html.bottom-layout .cp-panel{position:absolute;left:0;right:0;top:0;max-height:none;overflow:hidden;margin-top:0;border:1px solid var(--line);background:var(--white);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .2s ease,transform .2s ease,visibility 0s linear .2s}
html.bottom-layout .cp-panel.open{max-height:none;margin-top:0;opacity:1;visibility:visible;transform:none;transition:opacity .22s ease .06s,transform .22s ease .06s,visibility 0s}
html.bottom-layout .cp-panel-head{border-radius:var(--r-sm) var(--r-sm) 0 0}
html.bottom-layout .notice-board-body textarea{resize:none}
  </style>
  <script>try{if(localStorage.getItem('sc-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <script>try{if(localStorage.getItem('sc-layout')!=='classic')document.documentElement.classList.add('bottom-layout')}catch(e){document.documentElement.classList.add('bottom-layout')}</script>
</head>
<body>
<div id="app">
  <nav id="main-nav" style="display:none">
    <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
      <div id="nav-back-wrap" style="display:none">
        <div class="nav-back" id="btn-nav-back">← Home</div>
      </div>
      <div class="brand" id="nav-brand">Shadab Coaching Centre<small>Live Quiz</small></div>
    </div>
    <div class="nav-right">
      <div id="ci" style="display:none"></div>
      <button class="nav-online" id="nav-online" title="Members online" aria-label="Members online"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="online-n">–</span></button>
      <span id="conn-lbl">connecting</span>
      <div class="profile-wrap" id="profile-wrap">
        <div class="profile-btn" id="profile-btn">
          <div class="p-avatar" id="p-avatar">?</div>
        </div>
      </div>
    </div>
  </nav>
  <main><div id="view"></div></main>
</div>

<!-- Profile menu: dropdown under the top bar (classic) / sheet above the bottom bar (new layout) -->
<div class="p-scrim" id="p-scrim"></div>
<div class="p-dropdown hidden" id="p-dropdown">
  <div class="pd-info">
    <div class="pd-name" id="pd-full-name"></div>
    <div class="pd-email" id="pd-email"></div>
  </div>
  <div class="pd-item" id="btn-profile"><span class="pd-emo">📊</span><svg width="18" height="18" class="pd-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="pd-lbl">Profile</span></div>
  <div class="pd-item" id="btn-theme-toggle" role="button" aria-label="Toggle dark mode"><span class="pd-emo" id="theme-emo">🌙</span><svg width="18" height="18" class="pd-svg ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg width="18" height="18" class="pd-svg ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="pd-lbl" id="theme-lbl">Dark mode</span></div>
  <div class="pd-item" id="btn-toggle-layout" role="button"><span class="pd-emo">🔀</span><svg width="18" height="18" class="pd-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15h18"/></svg><span class="pd-lbl">Toggle Layout</span><span class="pd-hint" id="layout-hint">Modern</span></div>
  <div class="pd-item" id="btn-fetch-updates"><span class="pd-emo">🔄</span><svg width="18" height="18" class="pd-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg><span class="pd-lbl">Fetch Updates</span></div>
  <div class="pd-item danger" id="btn-logout"><span class="pd-emo">🚪</span><svg width="18" height="18" class="pd-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="pd-lbl">Sign out</span></div>
</div>

<!-- Bottom navbar (new layout). Fixed to the viewport so it can never slide under the browser bar. -->
<div class="bnav" id="bnav">
  <button class="bn-item" id="bn-lb" aria-label="Leaderboard" title="Leaderboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
  </button>
  <button class="bn-item" id="bn-home" aria-label="Home" title="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
  </button>
  <button class="bn-item" id="bn-chat" aria-label="Chat" title="Chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
    <span class="chat-unread bn-badge" style="display:none"></span>
  </button>
  <button class="bn-item" id="bn-profile" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>

<audio id="remote-audio" autoplay playsinline style="display:none"></audio>
<canvas id="confetti-canvas"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<!-- Token injected server-side so backend.js can use it without being served through a template -->
<script>window.MY_TOKEN = '%%MY_TOKEN%%';</script>
<!-- Load order: score → function → ui → chat → backend (backend has boot code, must be last) -->
<script defer src="score.js"></script>
<script defer src="function.js"></script>
<script defer src="ui.js"></script>
<script defer src="chat.js"></script>
<script defer src="backend.js"></script>
</body>
</html>
