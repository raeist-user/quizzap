<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Shadab Coaching Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <script>try{if(localStorage.getItem('sc-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body>
<div id="app">
  <nav id="main-nav" style="display:none">
    <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
      <div id="nav-back-wrap" style="display:none">
        <div class="nav-back" id="btn-nav-back">← Home</div>
      </div>
      <div class="brand" id="nav-brand">Shadab Coaching Centre<small>Live Quiz</small></div>
    </div>
    <div class="nav-right">
      <div id="ci" style="display:none"></div>
      <button class="nav-online" id="nav-online" title="Members online" aria-label="Members online"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="online-n">0</span></button>
      <span id="conn-lbl">connecting</span>
      <div class="profile-wrap" id="profile-wrap">
        <div class="profile-btn" id="profile-btn">
          <div class="p-avatar" id="p-avatar">?</div>
        </div>
        <div class="p-dropdown hidden" id="p-dropdown">
          <div class="pd-info">
            <div class="pd-name" id="pd-full-name"></div>
            <div class="pd-email" id="pd-email"></div>
          </div>
          <div class="pd-item" id="btn-profile">📊 My Profile</div>
          <div class="pd-item" id="btn-theme-toggle" role="button" aria-label="Toggle dark mode">🌙 Dark mode</div>
          <div class="pd-item" id="btn-fetch-updates">🔄 Fetch Updates</div>
          <div class="pd-item danger" id="btn-logout">🚪 Sign out</div>
        </div>
      </div>
    </div>
  </nav>
  <main><div id="view"></div></main>
</div>

<audio id="remote-audio" autoplay playsinline style="display:none"></audio>
<canvas id="confetti-canvas"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<!-- Token injected server-side so backend.js can use it without being served through a template -->
<script>window.MY_TOKEN = '%%MY_TOKEN%%';</script>
<!-- Load order: score → function → ui → chat → backend (backend has boot code, must be last) -->
<script defer src="score.js"></script>
<script defer src="function.js"></script>
<script defer src="ui.js"></script>
<script defer src="chat.js"></script>
<script defer src="backend.js"></script>
</body>
</html>
