<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Shadab Coaching Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"/>
  <link rel="stylesheet" href="styles.css?v=newlayout2"/>
  <style>.pd-svg{display:none;width:18px;height:18px}.bnav,.p-scrim{display:none}</style>
  <script>try{if(localStorage.getItem('sc-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <script>try{if(localStorage.getItem('sc-layout')==='bottom')document.documentElement.classList.add('bottom-layout')}catch(e){}</script>
</head>
<body>
<div id="app">
  <nav id="main-nav" style="display:none">
    <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
      <div id="nav-back-wrap" style="display:none">
        <div class="nav-back" id="btn-nav-back">← Home</div>
      </div>
      <div class="brand" id="nav-brand">Shadab Coaching Centre<small>Live Quiz</small></div>
    </div>
    <div class="nav-right">
      <div id="ci" style="display:none"></div>
      <button class="nav-online" id="nav-online" title="Members online" aria-label="Members online"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="online-n">0</span></button>
      <span id="conn-lbl">connecting</span>
      <div class="profile-wrap" id="profile-wrap">
        <div class="profile-btn" id="profile-btn">
          <div class="p-avatar" id="p-avatar">?</div>
        </div>
      </div>
    </div>
  </nav>
  <main><div id="view"></div></main>
</div>

<!-- Profile menu: dropdown under the top bar (classic) / sheet above the bottom bar (new layout) -->
<div class="p-scrim" id="p-scrim"></div>
<div class="p-dropdown hidden" id="p-dropdown">
  <div class="pd-info">
    <div class="pd-name" id="pd-full-name"></div>
    <div class="pd-email" id="pd-email"></div>
  </div>
  <div class="pd-item" id="btn-profile"><span class="pd-emo">📊</span><svg width="18" height="18" class="pd-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="pd-lbl">My Profile</span></div>
  <div class="pd-item" id="btn-theme-toggle" role="button" aria-label="Toggle dark mode"><span class="pd-emo" id="theme-emo">🌙</span><svg width="18" height="18" class="pd-svg ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg width="18" height="18" class="pd-svg ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="pd-lbl" id="theme-lbl">Dark mode</span></div>
  <div class="pd-item" id="btn-toggle-layout" role="button"><span class="pd-emo">🔀</span><svg width="18" height="18" class="pd-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15h18"/></svg><span class="pd-lbl">Toggle Layout</span><span class="pd-hint" id="layout-hint">Classic</span></div>
  <div class="pd-item" id="btn-fetch-updates"><span class="pd-emo">🔄</span><svg width="18" height="18" class="pd-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg><span class="pd-lbl">Fetch Updates</span></div>
  <div class="pd-item danger" id="btn-logout"><span class="pd-emo">🚪</span><svg width="18" height="18" class="pd-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="pd-lbl">Sign out</span></div>
</div>

<!-- Bottom navbar (new layout). Fixed to the viewport so it can never slide under the browser bar. -->
<div class="bnav" id="bnav">
  <button class="bn-item" id="bn-lb" aria-label="Leaderboard" title="Leaderboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
  </button>
  <button class="bn-item" id="bn-home" aria-label="Home" title="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
  </button>
  <button class="bn-item" id="bn-chat" aria-label="Chat" title="Chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
    <span class="chat-unread bn-badge" style="display:none"></span>
  </button>
  <button class="bn-item" id="bn-profile" aria-label="Profile" title="Profile">
    <div class="bn-avatar" id="bn-avatar">?</div>
  </button>
</div>

<audio id="remote-audio" autoplay playsinline style="display:none"></audio>
<canvas id="confetti-canvas"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<!-- Token injected server-side so backend.js can use it without being served through a template -->
<script>window.MY_TOKEN = '%%MY_TOKEN%%';</script>
<!-- Load order: score → function → ui → chat → backend (backend has boot code, must be last) -->
<script defer src="score.js"></script>
<script defer src="function.js"></script>
<script defer src="ui.js"></script>
<script defer src="chat.js"></script>
<script defer src="backend.js"></script>
</body>
</html>
